<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Contact | Daily Smart Finds</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-ivory text-charcoal">
    <nav class="bg-white p-4"><div class="container mx-auto"><a href="index.html" class="font-bold">Daily Smart Finds</a></div></nav>
    <main class="container mx-auto py-10 px-4">
        <h1 class="text-4xl font-bold mb-8">Contact Us</h1>
        <form class="max-w-md space-y-4">
            <input type="text" placeholder="Name" class="w-full p-2 border">
            <input type="email" placeholder="Email" class="w-full p-2 border">
            <textarea placeholder="Message" class="w-full p-2 border"></textarea>
            <button class="bg-steel text-white px-4 py-2">Send</button>
        </form>
    </main>
</body>
</html>
